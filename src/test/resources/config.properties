# ════════════════════════════════════════════════════════════════════════════
# config.properties — Central configuration for ApiNexus tests.
# ConfigManager.java reads this file once at startup and caches the values.
# ════════════════════════════════════════════════════════════════════════════

# ── Public test APIs ─────────────────────────────────────────────────────────
# JSONPlaceholder: a free, open REST API with fake data (no auth required).
# All mutating operations (POST/PUT/PATCH/DELETE) are faked — the server
# always returns a realistic response but does not persist data.
base.url=https://jsonplaceholder.typicode.com

# ReqRes: another free API that simulates real auth flows (login, register).
auth.base.url=https://reqres.in/api

# ── Mock server mode ─────────────────────────────────────────────────────────
# Two modes are supported:
#   local  — starts an embedded WireMock JVM server on mock.server.port
#            (default; works with no internet connection)
#   remote — registers stubs via the WireMock Admin REST API on a cloud server
#            (requires mock.remote.url; optional mock.remote.api.key)
mock.mode=local

# Port for the LOCAL embedded WireMock server (used only when mock.mode=local).
mock.server.port=8089

# ── Remote WireMock settings (used only when mock.mode=remote) ───────────────
# Full base URL of the remote WireMock server. Examples:
#   WireMock Cloud:   https://YOUR-ID.wiremockapi.cloud
#   Self-hosted:      http://my-wiremock.fly.dev
#   Docker on VPS:    http://123.45.67.89:8080
mock.remote.url=https://YOUR-WIREMOCK-ID.wiremockapi.cloud

# API key for WireMock Cloud (find it in your cloud dashboard → API).
# Leave blank for self-hosted WireMock without --api-key flag.
mock.remote.api.key=

# ── HTTP client timeouts (milliseconds) ─────────────────────────────────────
# How long to wait for the TCP connection to be established.
http.connect.timeout=5000
# How long to wait for a complete response after the connection is open.
http.read.timeout=10000

# ── Performance thresholds ───────────────────────────────────────────────────
# Maximum acceptable response time (ms) before a test is marked as slow.
performance.max.response.time.ms=2000

# ── Authentication tokens ────────────────────────────────────────────────────
# ReqRes returns a real token on POST /login; hard-coded here as a fallback
# for tests that use the token without performing the login flow themselves.
auth.demo.token=QpwL5tpe83ilfN2

# ── Test data ────────────────────────────────────────────────────────────────
# JSONPlaceholder returns 100 posts; these IDs are used in parameterised tests.
test.valid.post.id=1
test.invalid.post.id=9999

# Pagination defaults used in pagination tests
pagination.default.page=1
pagination.default.per.page=6

# ReqRes user IDs
test.valid.user.id=2
test.invalid.user.id=23
